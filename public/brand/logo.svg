<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="games.brassey.io">
  <title>games.brassey.io</title>
  <defs>
    <linearGradient id="voidBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070414"/>
      <stop offset="100%" stop-color="#0c0820"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a4fff"/>
      <stop offset="100%" stop-color="#66e0ff"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66e0ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#66e0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#66e0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8a4fff" stroke-opacity="0.1" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- dark base with rounded corners -->
  <rect width="512" height="512" rx="24" fill="url(#voidBg)"/>

  <!-- subtle grid texture -->
  <rect width="512" height="512" rx="24" fill="url(#grid)"/>

  <!-- corner brackets: chrome detail matching the portal's .panel style -->
  <g stroke="#8a4fff" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M 24 60 L 24 24 L 60 24"/>
    <path d="M 488 60 L 488 24 L 452 24"/>
    <path d="M 24 452 L 24 488 L 60 488"/>
    <path d="M 488 452 L 488 488 L 452 488"/>
  </g>

  <!-- ambient core halo -->
  <circle cx="256" cy="256" r="200" fill="url(#coreGlow)"/>

  <!-- outer hexagon — the mark -->
  <g filter="url(#glow)">
    <path
      d="M 96 168 L 256 80 L 416 168 L 416 344 L 256 432 L 96 344 Z"
      fill="none"
      stroke="url(#hexStroke)"
      stroke-width="5"
      stroke-linejoin="round"
    />
  </g>

  <!-- inner hexagon accent -->
  <path
    d="M 144 192 L 256 128 L 368 192 L 368 320 L 256 384 L 144 320 Z"
    fill="none"
    stroke="#8a4fff"
    stroke-width="1"
    stroke-opacity="0.5"
    stroke-dasharray="4 6"
  />

  <!-- connection spokes from center -->
  <g stroke="#8a4fff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" filter="url(#softGlow)">
    <line x1="256" y1="256" x2="160" y2="192"/>
    <line x1="256" y1="256" x2="352" y2="192"/>
    <line x1="256" y1="256" x2="256" y2="360"/>
  </g>

  <!-- node dots at spoke ends -->
  <g fill="#8a4fff" filter="url(#softGlow)">
    <circle cx="160" cy="192" r="5"/>
    <circle cx="352" cy="192" r="5"/>
    <circle cx="256" cy="360" r="5"/>
  </g>

  <!-- central core node -->
  <circle cx="256" cy="256" r="22" fill="#030208"/>
  <circle cx="256" cy="256" r="20" fill="none" stroke="#66e0ff" stroke-width="2"/>
  <circle cx="256" cy="256" r="10" fill="#66e0ff" filter="url(#glow)"/>

  <!-- scanline overlay for the CRT feel -->
  <g opacity="0.14">
    <rect x="0" y="0" width="512" height="1" fill="#ffffff"/>
    <rect x="0" y="4" width="512" height="1" fill="#ffffff"/>
    <rect x="0" y="8" width="512" height="1" fill="#ffffff"/>
    <rect x="0" y="12" width="512" height="1" fill="#ffffff"/>
  </g>
  <rect width="512" height="512" rx="24" fill="none" stroke="#8a4fff" stroke-opacity="0.4" stroke-width="1"/>
</svg>
