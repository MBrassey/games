<!--
  Runtime shell for LÖVE2D games compiled with love.js.
  Committed into the repo; sibling files (love.js, love.wasm, game.js, game.data,
  theme/) are produced by scripts/build-claude-mythos.sh and checked in with
  the build artifact.

  Exchange protocol with the parent GameRunner:
    parent → runtime:
      { type: "loveweb:auth",             signedIn }
      { type: "loveweb:saves:manifest",   files: [{path, updated_at}] }
      { type: "loveweb:save:data",        reqId, dataB64 | null }
      { type: "loveweb:achievements:state", unlocks: [{key, unlockedAt, points}] }
      { type: "loveweb:achievement:ack",  key, fresh, points }
    runtime → parent:
      { type: "loveweb:ready",            game }
      { type: "loveweb:save:write",       path, dataB64, meta }
      { type: "loveweb:save:read",        path, reqId }
      { type: "loveweb:log",              level, msg }
      { type: "loveweb:achievement:unlock", key, meta }

  Achievements magic-print protocol (Lua → runtime):
    Games call `print("[[LOVEWEB_ACH]]unlock <key>")` to unlock an
    achievement. The key must exist in the game's achievements.json.
    Optional JSON payload: `print("[[LOVEWEB_ACH]]unlock <key> {\"run\":7}")`.
    Unlocks are idempotent server-side.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LÖVE runtime</title>
  <link rel="stylesheet" type="text/css" href="theme/love.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #030208; height: 100%; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; color: #8a4fff; font-family: ui-monospace, monospace; }
    /* Explicit `visibility: visible !important` overrides theme/love.css's
       default `#canvas { visibility: hidden; }`. Without this the canvas
       renders but stays invisible — the classic "everything looks fine but
       screen is black" love.js trap.
       image-rendering: auto gives smooth scaling for vector fonts at
       non-integer ratios; `pixelated` was blurring the text. */
    #canvas {
      display: block;
      outline: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: auto;
      visibility: visible !important;
    }
    #loadingCanvas { display: none; }
    #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #66e0ff; text-shadow: 0 0 8px #66e0ff66; }
    footer { display: none; }
  </style>
</head>
<body>
  <div id="boot">compiling kernel<span id="boot-dots">...</span></div>
  <canvas id="loadingCanvas" width="800" height="600"></canvas>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    // --- bridge state ---
    var SLUG = new URLSearchParams(location.search).get("slug") || "claude-mythos";
    // love.js save dir (emscripten): /home/web_user/love/<identity>/ —
    // verified empirically by scripts/probe-save-dir.mjs which injects
    // `print(love.filesystem.getSaveDirectory())` into main.lua. NOT the
    // Linux convention `/home/USER/.local/share/love/<id>/`; emscripten's
    // love build drops the XDG path and uses a flat /love/ dir directly
    // under HOME. Do not change without re-running the probe.
    var SAVE_ROOT = "/home/web_user/love";

    var manifestResolve;
    var manifestPromise = new Promise(function (res) { manifestResolve = res; });
    var pendingReads = new Map();

    // Achievement state snapshot delivered by the parent before the game
    // boots. Resolved during preRun and written into the save FS so the
    // game can read it with standard love.filesystem calls.
    var achievementsResolve;
    var achievementsPromise = new Promise(function (res) { achievementsResolve = res; });

    // Reserved path (under SAVE_ROOT) for portal ↔ game metadata that
    // isn't part of the game's own save set. The save-watch loop skips
    // this subtree so it doesn't round-trip to /api/saves.
    var LOVEWEB_META_DIR = "__loveweb__";

    // Register the message listener BEFORE announcing our existence, so we
    // don't miss a fast reply.
    window.addEventListener("message", (ev) => {
      const d = ev.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "loveweb:saves:manifest") manifestResolve(d.files || []);
      if (d.type === "loveweb:save:data" && d.reqId && pendingReads.has(d.reqId)) {
        const r = pendingReads.get(d.reqId); pendingReads.delete(d.reqId); r(d.dataB64);
      }
      if (d.type === "loveweb:achievements:state") {
        achievementsResolve(d.unlocks || []);
        // After boot, also refresh the on-disk snapshot so a game that
        // re-reads __loveweb__/achievements.json mid-play sees new unlocks.
        try {
          var FS = Module && Module.FS;
          if (FS) {
            var dir = SAVE_ROOT + "/" + LOVEWEB_META_DIR;
            try { FS.mkdirTree(dir); } catch (e) {}
            var payload = JSON.stringify({ version: 1, unlocks: d.unlocks || [] });
            FS.writeFile(dir + "/achievements.json", new TextEncoder().encode(payload));
          }
        } catch (e) { /* pre-boot: preRun writer handles it */ }
      }
      if (d.type === "loveweb:achievement:ack") {
        // After a fresh unlock the parent re-emits the full state so the
        // running game can re-read its meta file without a reload. The
        // state message handler above takes care of writing it; the ack
        // exists mainly to surface in logs for debugging.
        log("info", "achievement ack " + d.key + (d.fresh ? " (fresh)" : " (replay)"));
      }
    });
    function requestRemoteRead(path) {
      const reqId = Math.random().toString(36).slice(2);
      return new Promise((res) => {
        pendingReads.set(reqId, res);
        parent.postMessage({ type: "loveweb:save:read", path, reqId }, "*");
        setTimeout(() => { if (pendingReads.has(reqId)) { pendingReads.delete(reqId); res(null); } }, 5000);
      });
    }
    function b64ToBytes(b64) {
      const bin = atob(b64); const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    }
    function bytesToB64(u8) {
      let s = ""; const CH = 0x8000;
      for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
      return btoa(s);
    }
    function log(level, msg) { parent.postMessage({ type: "loveweb:log", level, msg: String(msg) }, "*"); }

    // Magic-print protocol: LÖVE games push structured events to the portal
    // by calling `print("[[LOVEWEB_...]]...")`. Intercepting at the stdout
    // boundary means the game side only needs standard Lua stdio — no
    // Lua↔JS FFI required.
    //
    // Two prefix namespaces:
    //   [[LOVEWEB_ACH]]  — achievements
    //   [[LOVEWEB_FX]]   — UI effects (parent overlay flashes/shakes/etc.)
    //
    // Returns true if the line was consumed (so we suppress the raw log
    // spam) or false if it should fall through to the normal log stream.
    var ACH_PREFIX = "[[LOVEWEB_ACH]]";
    var FX_PREFIX  = "[[LOVEWEB_FX]]";

    function handleMagicLine(s) {
      if (typeof s !== "string") return false;

      // Achievements ---------------------------------------------------
      var ai = s.indexOf(ACH_PREFIX);
      if (ai >= 0) {
        var rest = s.slice(ai + ACH_PREFIX.length).trim();
        var sp = rest.indexOf(" ");
        var verb = sp < 0 ? rest : rest.slice(0, sp);
        var tail = sp < 0 ? "" : rest.slice(sp + 1).trim();
        if (verb === "unlock") {
          var key = tail, meta = null;
          var m = tail.match(/^(\S+)\s+(\{[\s\S]*\})$/);
          if (m) {
            key = m[1];
            try { meta = JSON.parse(m[2]); } catch (e) { meta = null; }
          }
          if (!/^[a-z0-9_]+$/.test(key || "")) {
            log("warn", "achievement unlock with bad key: " + key);
            return true;
          }
          parent.postMessage({ type: "loveweb:achievement:unlock", key: key, meta: meta }, "*");
          return true;
        }
        log("warn", "unknown loveweb-ach verb: " + verb);
        return true;
      }

      // UI effects -----------------------------------------------------
      var fi = s.indexOf(FX_PREFIX);
      if (fi >= 0) {
        var fbody = s.slice(fi + FX_PREFIX.length).trim();
        var fparts = fbody.split(/\s+/);
        var fverb = fparts.shift() || "";
        // Everything is posted raw to the parent — the parent does
        // validation, clamping, and reduced-motion handling centrally.
        // Keeps the per-frame runtime cost here minimal.
        parent.postMessage({
          type: "loveweb:fx",
          verb: fverb,
          args: fparts,
        }, "*");
        return true;
      }

      return false;
    }

    // Tell the parent we're alive immediately, before WASM init starts.
    // The parent answers with loveweb:saves:manifest, which arrives during
    // WASM init and is ready by the time preRun awaits it.
    //
    // Previously the manifest was only sent after loveweb:ready (postRun),
    // which fires AFTER the game has already booted and read from MEMFS
    // — meaning saves never appeared in-game no matter what we stored.
    try { parent.postMessage({ type: "loveweb:hello", game: SLUG }, "*"); } catch (e) {}

    function goFullScreen() {
      const c = document.getElementById("canvas");
      (c.requestFullScreen || c.webkitRequestFullScreen || c.mozRequestFullScreen || function(){}).call(c);
    }
    window.onload = () => window.focus();
    window.onclick = () => window.focus();
    window.addEventListener("keydown", (e) => {
      if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
    }, false);

    // NB: must be `var` (not `const`/`let`) — love.js's generated game.js
    // re-declares `Module` with a `var` and merges into this one. Using
    // `const` here breaks that merge with a SyntaxError.
    // Emit once — Module.quit / onExit / onAbort can all race to fire
    // during a clean love.event.quit() teardown. The parent only needs
    // the first signal to start its exit flow.
    var quitSignalled = false;
    function signalQuit(status, reason) {
      if (quitSignalled) return;
      quitSignalled = true;
      try {
        parent.postMessage({
          type: "loveweb:quit",
          status: status == null ? 0 : status,
          reason: reason || null,
        }, "*");
      } catch (e) {}
    }

    var Module = {
      arguments: ["./game.love"],
      INITIAL_MEMORY: 33554432,
      printErr: (t) => { if (!handleMagicLine(t)) log("error", t); },
      print:    (t) => { if (!handleMagicLine(t)) log("info", t); },
      // Emscripten's runtime exit hooks. love.event.quit() in Lua breaks
      // the main loop; love.js then calls emscripten_force_exit which
      // invokes Module.quit and Module.onExit. We register for both
      // because the exact path depends on love.js version, and add
      // onAbort for hard-crash paths so the parent can still recover.
      onExit:  function (code) { signalQuit(code, null); },
      onAbort: function (what) { signalQuit(1, String(what || "abort")); },
      canvas: (function(){
        const c = document.getElementById("canvas");
        c.addEventListener("webglcontextlost", (e) => { log("error", "webgl lost"); e.preventDefault(); }, false);
        return c;
      })(),
      setStatus: function(text) {
        const boot = document.getElementById("boot");
        if (text) {
          if (boot) boot.textContent = text;
        } else if (Module.remainingDependencies === 0) {
          if (boot) boot.style.display = "none";
          // Belt-and-suspenders: also force canvas visible, since some
          // themed CSS hides it by default until this hook fires.
          const c = document.getElementById("canvas");
          if (c) { c.style.visibility = "visible"; c.style.display = "block"; }
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function(left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? ("preparing " + (this.totalDependencies-left) + "/" + this.totalDependencies) : "");
      },
      preRun: [
        function preAchievements() {
          // Inject the current achievement state at a stable path so the
          // game can read it with `love.filesystem.read("__loveweb__/achievements.json")`.
          // We wait up to 3s for the parent to push the state; absence is
          // not fatal — the file just gets written empty and the game
          // treats that as "nothing unlocked yet."
          Module.addRunDependency("loveweb-achievements");
          (async () => {
            try {
              const FS = Module.FS;
              if (!FS) throw new Error("Module.FS not available");
              const unlocks = await Promise.race([
                achievementsPromise,
                new Promise((res) => setTimeout(function(){ res([]); }, 3000)),
              ]);
              const dir = SAVE_ROOT + "/" + LOVEWEB_META_DIR;
              try { FS.mkdirTree(dir); } catch {}
              const payload = JSON.stringify({
                version: 1,
                unlocks: unlocks,
              });
              const bytes = new TextEncoder().encode(payload);
              FS.writeFile(dir + "/achievements.json", bytes);
              log("info", "achievement state injected (" + unlocks.length + " unlock(s))");
            } catch (e) { log("warn", "achievement state injection: " + e); }
            finally { Module.removeRunDependency("loveweb-achievements"); }
          })();
        },
        function prePopulate() {
          Module.addRunDependency("loveweb-saves");
          (async () => {
            try {
              // IMPORTANT: use Module.FS, not bare FS. Emscripten's FS is
              // a closure-local in love.js; it's only exposed to user code
              // via the Module object. Referencing `FS` here resolves to
              // window.FS, which is undefined — previously every write
              // silently failed with a "ReferenceError: FS is not defined"
              // buried in the bridge log.
              const FS = Module.FS;
              if (!FS) throw new Error("Module.FS not available");

              const files = await Promise.race([
                manifestPromise,
                new Promise((res) => setTimeout(function(){ res([]); }, 4000)),
              ]);
              for (const f of files) {
                const b64 = await requestRemoteRead(f.path);
                if (!b64) { log("warn", "no data returned for " + f.path); continue; }
                const bytes = b64ToBytes(b64);
                const full = SAVE_ROOT + "/" + f.path.replace(/^\//, "");
                const dir = full.substring(0, full.lastIndexOf("/"));
                try { FS.mkdirTree(dir); } catch {}
                try {
                  FS.writeFile(full, bytes);
                  log("info", "wrote " + full + " (" + bytes.length + " bytes)");
                } catch (e) {
                  log("warn", "write " + full + ": " + e);
                }
              }
              log("info", "prepopulated " + files.length + " save file(s)");
            } catch (e) { log("warn", "prepopulate: " + e); }
            finally { Module.removeRunDependency("loveweb-saves"); }
          })();
        },
      ],
      postRun: [
        function installQuitHook() {
          // love.js/emscripten 11 assigns Module.quit during runtime init;
          // by postRun time it exists and we can wrap it. This catches the
          // love.event.quit() path — the Lua-side clean-exit signal —
          // which emscripten routes through Module.quit once love.run
          // returns.
          var origQuit = Module.quit;
          Module.quit = function (status, toThrow) {
            signalQuit(status, null);
            if (typeof origQuit === "function") {
              try { return origQuit.call(Module, status, toThrow); } catch (e) {}
            }
          };
        },
        function startSyncLoop() {
          parent.postMessage({ type: "loveweb:ready", game: SLUG }, "*");

          const FS = Module.FS; // same gotcha as prePopulate; use Module.FS
          if (!FS) { log("error", "postRun: Module.FS not available"); return; }

          const mtimes = new Map();
          function walk(dir, visit) {
            let entries;
            try { entries = FS.readdir(dir); } catch { return; }
            for (const e of entries) {
              if (e === "." || e === "..") continue;
              const p = dir + "/" + e;
              let st; try { st = FS.stat(p); } catch { continue; }
              if (FS.isDir(st.mode)) walk(p, visit);
              else visit(p, st);
            }
          }

          // Any change under /__loveweb__/ is portal-managed metadata and
          // must not be synced back to /api/saves — otherwise the injected
          // achievement state would round-trip into `game_saves`.
          const metaPrefix = SAVE_ROOT + "/" + LOVEWEB_META_DIR + "/";
          setInterval(() => {
            try {
              try { FS.mkdirTree(SAVE_ROOT); } catch {}
              walk(SAVE_ROOT, (p, st) => {
                if (p.indexOf(metaPrefix) === 0) return;
                const mt = +st.mtime;
                const prev = mtimes.get(p);
                if (prev === mt) return;
                mtimes.set(p, mt);
                if (prev === undefined) return; // first-seen on pre-populate; skip echo
                try {
                  const bytes = FS.readFile(p);
                  const rel = p.replace(SAVE_ROOT + "/", "");
                  parent.postMessage({
                    type: "loveweb:save:write",
                    path: rel,
                    dataB64: bytesToB64(bytes),
                    meta: { size: bytes.byteLength, mtime: mt },
                  }, "*");
                } catch (e) { log("warn", "flush " + p + ": " + e); }
              });
            } catch {}
          }, 2000);

          window.addEventListener("beforeunload", () => {
            try {
              walk(SAVE_ROOT, (p) => {
                if (p.indexOf(metaPrefix) === 0) return;
                const bytes = FS.readFile(p);
                const rel = p.replace(SAVE_ROOT + "/", "");
                parent.postMessage({
                  type: "loveweb:save:write",
                  path: rel,
                  dataB64: bytesToB64(bytes),
                  meta: { final: true },
                }, "*");
              });
            } catch {}
          });
        },
      ],
    };
    Module.setStatus("downloading…");
    window.onerror = function(){ Module.setStatus("exception: see console"); };

    var applicationLoad = function(){ Love(Module); };
  </script>

  <!-- love.js emits game.js (assets manifest) + love.js (wasm loader). -->
  <script type="text/javascript" src="game.js"></script>
  <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>
</body>
</html>
