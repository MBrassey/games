<!--
  Runtime shell for LÖVE2D games compiled with love.js.
  Committed into the repo; sibling files (love.js, love.wasm, game.js, game.data,
  theme/) are produced by scripts/build-claude-mythos.sh and checked in with
  the build artifact.

  Exchange protocol with the parent GameRunner:
    parent → runtime:
      { type: "loveweb:auth",             signedIn }
      { type: "loveweb:saves:manifest",   files: [{path, updated_at}] }
      { type: "loveweb:save:data",        reqId, dataB64 | null }
      { type: "loveweb:achievements:state", unlocks: [{key, unlockedAt, points}] }
      { type: "loveweb:achievement:ack",  key, fresh, points }
      { type: "loveweb:identity",         identity: {signedIn, userId?, handle?, avatar?} }
      { type: "loveweb:net:hello",        roomId, mode, state, stateVersion, at }
      { type: "loveweb:net:event",        event: {id, roomId, userId, handle, avatar, verb, payload, ts} }
      { type: "loveweb:net:roster",       roomId, members: [{userId, handle, avatar, joinedAt, lastSeen}] }
      { type: "loveweb:net:closed",       roomId }
      { type: "loveweb:net:disconnected", roomId }
      { type: "loveweb:net:create:result", reqId?, ok, room?, error? }
      { type: "loveweb:net:join:result",   reqId?, ok, room?, error? }
      { type: "loveweb:net:leave:result",  reqId?, ok }
      { type: "loveweb:net:send:result",   reqId?, ok, event?, error? }
      { type: "loveweb:net:state:result",  reqId?, ok, state?, version?, error? }
      { type: "loveweb:net:list:result",   reqId?, rooms: [...] }
    runtime → parent:
      { type: "loveweb:ready",            game }
      { type: "loveweb:save:write",       path, dataB64, meta }
      { type: "loveweb:save:read",        path, reqId }
      { type: "loveweb:log",              level, msg }
      { type: "loveweb:achievement:unlock", key, meta }
      { type: "loveweb:net:list",         reqId? }
      { type: "loveweb:net:create",       reqId?, name, visibility?, capacity?, state? }
      { type: "loveweb:net:join",         reqId?, code? | roomId? }
      { type: "loveweb:net:leave",        reqId? }
      { type: "loveweb:net:send",         reqId?, verb, payload? }
      { type: "loveweb:net:state",        reqId?, patch, expectedVersion?, replace? }

  Achievements magic-print protocol (Lua → runtime):
    Games call `print("[[LOVEWEB_ACH]]unlock <key>")` to unlock an
    achievement. The key must exist in the game's achievements.json.
    Optional JSON payload: `print("[[LOVEWEB_ACH]]unlock <key> {\"run\":7}")`.
    Unlocks are idempotent server-side.

  Multi-user net magic-print protocol (Lua → runtime):
    print("[[LOVEWEB_NET]]create <name>")           — create + join
    print("[[LOVEWEB_NET]]join <CODE>")             — join by 6-char code
    print("[[LOVEWEB_NET]]leave")                   — leave current room
    print("[[LOVEWEB_NET]]send <verb> <jsonbody>")  — broadcast event
    print("[[LOVEWEB_NET]]state <jsonpatch>")       — merge persistent state
    print("[[LOVEWEB_NET]]list")                    — request room list
    The runtime mirrors all responses + delivered events into files in
    the save dir under `__loveweb__/net/` so the game side reads them via
    love.filesystem.* without any JS interop.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LÖVE runtime</title>
  <link rel="stylesheet" type="text/css" href="theme/love.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #030208; height: 100%; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; color: #8a4fff; font-family: ui-monospace, monospace; }
    /* Explicit `visibility: visible !important` overrides theme/love.css's
       default `#canvas { visibility: hidden; }`. Without this the canvas
       renders but stays invisible — the classic "everything looks fine but
       screen is black" love.js trap.
       image-rendering: auto gives smooth scaling for vector fonts at
       non-integer ratios; `pixelated` was blurring the text. */
    #canvas {
      display: block;
      outline: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: auto;
      visibility: visible !important;
    }
    #loadingCanvas { display: none; }
    #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #66e0ff; text-shadow: 0 0 8px #66e0ff66; }
    footer { display: none; }
  </style>
</head>
<body>
  <div id="boot">compiling kernel<span id="boot-dots">...</span></div>
  <canvas id="loadingCanvas" width="800" height="600"></canvas>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    // --- bridge state ---
    var SLUG = new URLSearchParams(location.search).get("slug") || "claude-mythos";
    // love.js save dir (emscripten): /home/web_user/love/<identity>/ —
    // verified empirically by scripts/probe-save-dir.mjs which injects
    // `print(love.filesystem.getSaveDirectory())` into main.lua. NOT the
    // Linux convention `/home/USER/.local/share/love/<id>/`; emscripten's
    // love build drops the XDG path and uses a flat /love/ dir directly
    // under HOME. Do not change without re-running the probe.
    var SAVE_ROOT = "/home/web_user/love";

    var manifestResolve;
    var manifestPromise = new Promise(function (res) { manifestResolve = res; });
    var pendingReads = new Map();

    // Achievement state snapshot delivered by the parent before the game
    // boots. Resolved during preRun and written into the save FS so the
    // game can read it with standard love.filesystem calls.
    //
    // IMPORTANT: the file has to land INSIDE the LÖVE identity dir
    // (love.js puts the save dir at /home/web_user/love/<identity>/),
    // otherwise love.filesystem.read("__loveweb__/achievements.json")
    // resolves to a different path and the game sees nothing.
    var achievementsResolve;
    var achievementsPromise = new Promise(function (res) { achievementsResolve = res; });
    var loveIdentity = null; // set by parent via loveweb:achievements:state

    // Player identity surfaced to the game via __loveweb__/identity.json.
    // Resolved at preRun time (or earlier if the parent answers fast)
    // so the game can read its own user info inside love.load().
    var portalIdentityResolve;
    var portalIdentityPromise = new Promise(function (res) { portalIdentityResolve = res; });

    // Reserved path (relative to the identity dir) for portal ↔ game
    // metadata that isn't part of the game's own save set. The
    // save-watch loop skips this subtree so it doesn't round-trip to
    // /api/saves.
    var LOVEWEB_META_DIR = "__loveweb__";

    // Inbox file size cap. The runtime appends every delivered event
    // here; when it crosses ~256 KB we trim to the last 75% of lines so
    // the game can keep tailing without the file growing without bound.
    // Game-side watermarking by event.id keeps replays from looking like
    // duplicates after a trim.
    var NET_INBOX_MAX_BYTES = 256 * 1024;
    var NET_INBOX_KEEP_FRAC = 0.75;

    // Register the message listener BEFORE announcing our existence, so we
    // don't miss a fast reply.
    window.addEventListener("message", (ev) => {
      const d = ev.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "loveweb:saves:manifest") manifestResolve(d.files || []);
      if (d.type === "loveweb:save:data" && d.reqId && pendingReads.has(d.reqId)) {
        const r = pendingReads.get(d.reqId); pendingReads.delete(d.reqId); r(d.dataB64);
      }
      if (d.type === "loveweb:achievements:state") {
        if (d.identity) loveIdentity = d.identity;
        achievementsResolve(d.unlocks || []);
        // After boot, also refresh the on-disk snapshot so a game that
        // re-reads __loveweb__/achievements.json mid-play sees new unlocks.
        // Write inside the identity dir so love.filesystem can read it.
        try {
          var FS = Module && Module.FS;
          if (FS && loveIdentity) {
            var dir = SAVE_ROOT + "/" + loveIdentity + "/" + LOVEWEB_META_DIR;
            try { FS.mkdirTree(dir); } catch (e) {}
            var payload = JSON.stringify({ version: 1, unlocks: d.unlocks || [] });
            FS.writeFile(dir + "/achievements.json", new TextEncoder().encode(payload));
          }
        } catch (e) { /* pre-boot: preRun writer handles it */ }
      }
      if (d.type === "loveweb:achievement:ack") {
        // After a fresh unlock the parent re-emits the full state so the
        // running game can re-read its meta file without a reload. The
        // state message handler above takes care of writing it; the ack
        // exists mainly to surface in logs for debugging.
        log("info", "achievement ack " + d.key + (d.fresh ? " (fresh)" : " (replay)"));
      }
      if (d.type === "loveweb:identity") {
        portalIdentityResolve(d.identity || { signedIn: false });
        // Hot-rewrite at runtime too, in case identity arrives after
        // boot (e.g. user signs in mid-session via SPA navigation —
        // doesn't currently happen but cheap to support).
        try { writeMetaFile("identity.json", d.identity || { signedIn: false }); } catch (e) {}
      }
      if (d.type === "loveweb:net:hello") {
        try {
          writeMetaFile("net/room.json", {
            roomId: d.roomId,
            mode: d.mode,
            state: d.state || {},
            stateVersion: d.stateVersion || 0,
            connectedAt: d.at || Date.now(),
          });
          writeMetaFile("net/status.json", { status: "connected", roomId: d.roomId, at: Date.now() });
          // Reset inbox on (re)connect so the game can resync from the
          // backfill events that follow without confusing them with
          // stale entries from a prior session.
          writeMetaFile("net/inbox.jsonl", "");
        } catch (e) { log("warn", "net hello: " + e); }
      }
      if (d.type === "loveweb:net:event" && d.event) {
        try { appendNetInbox(d.event); } catch (e) { log("warn", "net inbox: " + e); }
      }
      if (d.type === "loveweb:net:roster") {
        try { writeMetaFile("net/roster.json", { roomId: d.roomId, members: d.members || [], at: Date.now() }); } catch (e) {}
      }
      if (d.type === "loveweb:net:closed") {
        try {
          writeMetaFile("net/status.json", { status: "closed", roomId: d.roomId, at: Date.now() });
        } catch (e) {}
      }
      if (d.type === "loveweb:net:disconnected") {
        try {
          writeMetaFile("net/status.json", { status: "disconnected", roomId: d.roomId, at: Date.now() });
        } catch (e) {}
      }
      if (
        d.type === "loveweb:net:create:result" ||
        d.type === "loveweb:net:join:result"   ||
        d.type === "loveweb:net:leave:result"  ||
        d.type === "loveweb:net:send:result"   ||
        d.type === "loveweb:net:state:result"  ||
        d.type === "loveweb:net:list:result"
      ) {
        try {
          writeMetaFile("net/last_result.json", Object.assign({ at: Date.now() }, d));
        } catch (e) {}
      }
    });

    // Helper: write a file under <SAVE_ROOT>/<identity>/__loveweb__/<rel>.
    // Creates intermediate dirs and tolerates being called before the
    // identity is known (queues a noop). `body` may be a string, a
    // Uint8Array, or any JSON-serializable value (objects/arrays get
    // JSON.stringify'd).
    function writeMetaFile(rel, body) {
      var FS = (window.Module && Module.FS) || null;
      if (!FS || !loveIdentity) return false;
      var base = SAVE_ROOT + "/" + loveIdentity + "/" + LOVEWEB_META_DIR;
      var full = base + "/" + rel;
      var dir = full.substring(0, full.lastIndexOf("/"));
      try { FS.mkdirTree(dir); } catch (e) {}
      var bytes;
      if (body instanceof Uint8Array) {
        bytes = body;
      } else if (typeof body === "string") {
        bytes = new TextEncoder().encode(body);
      } else {
        bytes = new TextEncoder().encode(JSON.stringify(body));
      }
      try { FS.writeFile(full, bytes); return true; } catch (e) { return false; }
    }

    // Append-only JSONL inbox for delivered net events. Trims the file
    // to NET_INBOX_KEEP_FRAC of NET_INBOX_MAX_BYTES (line-aligned) when
    // it grows past the cap so a long-lived session doesn't bloat MEMFS.
    function appendNetInbox(evt) {
      var FS = (window.Module && Module.FS) || null;
      if (!FS || !loveIdentity) return;
      var base = SAVE_ROOT + "/" + loveIdentity + "/" + LOVEWEB_META_DIR + "/net";
      try { FS.mkdirTree(base); } catch (e) {}
      var path = base + "/inbox.jsonl";
      var line = JSON.stringify(evt) + "\n";
      var existing = new Uint8Array(0);
      try { existing = FS.readFile(path); } catch (e) {}
      var combined;
      if (existing && existing.length + line.length > NET_INBOX_MAX_BYTES) {
        // Trim from the front, keeping the last NET_INBOX_KEEP_FRAC of
        // the cap. Walk forward from a target offset to the next newline
        // so we never split a JSON line.
        var keep = Math.floor(NET_INBOX_MAX_BYTES * NET_INBOX_KEEP_FRAC);
        var startAt = Math.max(0, existing.length - keep);
        while (startAt < existing.length && existing[startAt] !== 0x0a) startAt++;
        if (startAt < existing.length) startAt++;
        var trimmed = existing.subarray(startAt);
        var lineBytes = new TextEncoder().encode(line);
        combined = new Uint8Array(trimmed.length + lineBytes.length);
        combined.set(trimmed, 0);
        combined.set(lineBytes, trimmed.length);
      } else {
        var addBytes = new TextEncoder().encode(line);
        combined = new Uint8Array((existing ? existing.length : 0) + addBytes.length);
        if (existing && existing.length) combined.set(existing, 0);
        combined.set(addBytes, existing ? existing.length : 0);
      }
      try { FS.writeFile(path, combined); } catch (e) {}
    }
    function requestRemoteRead(path) {
      const reqId = Math.random().toString(36).slice(2);
      return new Promise((res) => {
        pendingReads.set(reqId, res);
        parent.postMessage({ type: "loveweb:save:read", path, reqId }, "*");
        setTimeout(() => { if (pendingReads.has(reqId)) { pendingReads.delete(reqId); res(null); } }, 5000);
      });
    }
    function b64ToBytes(b64) {
      const bin = atob(b64); const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    }
    function bytesToB64(u8) {
      let s = ""; const CH = 0x8000;
      for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
      return btoa(s);
    }
    function log(level, msg) { parent.postMessage({ type: "loveweb:log", level, msg: String(msg) }, "*"); }

    // Magic-print protocol: LÖVE games push structured events to the portal
    // by calling `print("[[LOVEWEB_...]]...")`. Intercepting at the stdout
    // boundary means the game side only needs standard Lua stdio — no
    // Lua↔JS FFI required.
    //
    // Two prefix namespaces:
    //   [[LOVEWEB_ACH]]  — achievements
    //   [[LOVEWEB_FX]]   — UI effects (parent overlay flashes/shakes/etc.)
    //
    // Returns true if the line was consumed (so we suppress the raw log
    // spam) or false if it should fall through to the normal log stream.
    var ACH_PREFIX = "[[LOVEWEB_ACH]]";
    var FX_PREFIX  = "[[LOVEWEB_FX]]";
    var NET_PREFIX = "[[LOVEWEB_NET]]";

    function handleMagicLine(s) {
      if (typeof s !== "string") return false;

      // Achievements ---------------------------------------------------
      var ai = s.indexOf(ACH_PREFIX);
      if (ai >= 0) {
        var rest = s.slice(ai + ACH_PREFIX.length).trim();
        var sp = rest.indexOf(" ");
        var verb = sp < 0 ? rest : rest.slice(0, sp);
        var tail = sp < 0 ? "" : rest.slice(sp + 1).trim();
        if (verb === "unlock") {
          var key = tail, meta = null;
          var m = tail.match(/^(\S+)\s+(\{[\s\S]*\})$/);
          if (m) {
            key = m[1];
            try { meta = JSON.parse(m[2]); } catch (e) { meta = null; }
          }
          if (!/^[a-z0-9_]+$/.test(key || "")) {
            log("warn", "achievement unlock with bad key: " + key);
            return true;
          }
          parent.postMessage({ type: "loveweb:achievement:unlock", key: key, meta: meta }, "*");
          return true;
        }
        log("warn", "unknown loveweb-ach verb: " + verb);
        return true;
      }

      // Net layer ------------------------------------------------------
      // Verbs:
      //   create <name>                        — create + auto-join
      //   join <CODE>                          — join existing room by 6-char code
      //   leave                                — leave current room
      //   send <verb> <jsonpayload>            — broadcast event to room
      //   state <jsonpatch>                    — merge persistent state
      //   list                                 — request public rooms (result lands in __loveweb__/net/last_result.json)
      // Anything malformed is dropped here with a warn — the parent
      // never sees it. The full validation happens server-side.
      var ni = s.indexOf(NET_PREFIX);
      if (ni >= 0) {
        var nbody = s.slice(ni + NET_PREFIX.length).trim();
        var nsp = nbody.indexOf(" ");
        var nverb = nsp < 0 ? nbody : nbody.slice(0, nsp);
        var ntail = nsp < 0 ? "" : nbody.slice(nsp + 1).trim();
        try {
          if (nverb === "create") {
            parent.postMessage({ type: "loveweb:net:create", name: ntail || "untitled room" }, "*");
          } else if (nverb === "join") {
            parent.postMessage({ type: "loveweb:net:join", code: ntail.toUpperCase() }, "*");
          } else if (nverb === "leave") {
            parent.postMessage({ type: "loveweb:net:leave" }, "*");
          } else if (nverb === "list") {
            parent.postMessage({ type: "loveweb:net:list" }, "*");
          } else if (nverb === "send") {
            // "send <verb> <jsonpayload>". Payload is optional.
            var sIdx = ntail.indexOf(" ");
            var sVerb = sIdx < 0 ? ntail : ntail.slice(0, sIdx);
            var sJson = sIdx < 0 ? "" : ntail.slice(sIdx + 1).trim();
            if (!/^[a-z][a-z0-9_]*$/.test(sVerb || "")) {
              log("warn", "[[LOVEWEB_NET]]send with bad verb: " + sVerb);
              return true;
            }
            var sPayload = null;
            if (sJson) {
              try { sPayload = JSON.parse(sJson); }
              catch (e) { log("warn", "[[LOVEWEB_NET]]send: invalid JSON payload"); return true; }
            }
            parent.postMessage({ type: "loveweb:net:send", verb: sVerb, payload: sPayload }, "*");
          } else if (nverb === "state") {
            var sPatch = null;
            try { sPatch = JSON.parse(ntail); }
            catch (e) { log("warn", "[[LOVEWEB_NET]]state: invalid JSON patch"); return true; }
            if (!sPatch || typeof sPatch !== "object" || Array.isArray(sPatch)) {
              log("warn", "[[LOVEWEB_NET]]state: patch must be a JSON object");
              return true;
            }
            parent.postMessage({ type: "loveweb:net:state", patch: sPatch }, "*");
          } else {
            log("warn", "unknown loveweb-net verb: " + nverb);
          }
        } catch (e) {
          log("warn", "loveweb-net handler: " + e);
        }
        return true;
      }

      // UI effects -----------------------------------------------------
      var fi = s.indexOf(FX_PREFIX);
      if (fi >= 0) {
        var fbody = s.slice(fi + FX_PREFIX.length).trim();
        var fparts = fbody.split(/\s+/);
        var fverb = fparts.shift() || "";
        // Everything is posted raw to the parent — the parent does
        // validation, clamping, and reduced-motion handling centrally.
        // Keeps the per-frame runtime cost here minimal.
        parent.postMessage({
          type: "loveweb:fx",
          verb: fverb,
          args: fparts,
        }, "*");
        return true;
      }

      return false;
    }

    // Tell the parent we're alive immediately, before WASM init starts.
    // The parent answers with loveweb:saves:manifest, which arrives during
    // WASM init and is ready by the time preRun awaits it.
    //
    // Previously the manifest was only sent after loveweb:ready (postRun),
    // which fires AFTER the game has already booted and read from MEMFS
    // — meaning saves never appeared in-game no matter what we stored.
    try { parent.postMessage({ type: "loveweb:hello", game: SLUG }, "*"); } catch (e) {}

    function goFullScreen() {
      const c = document.getElementById("canvas");
      (c.requestFullScreen || c.webkitRequestFullScreen || c.mozRequestFullScreen || function(){}).call(c);
    }
    window.onload = () => window.focus();
    window.onclick = () => window.focus();
    window.addEventListener("keydown", (e) => {
      if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
    }, false);

    // NB: must be `var` (not `const`/`let`) — love.js's generated game.js
    // re-declares `Module` with a `var` and merges into this one. Using
    // `const` here breaks that merge with a SyntaxError.
    // Emit once — Module.quit / onExit / onAbort can all race to fire
    // during a clean love.event.quit() teardown. The parent only needs
    // the first signal to start its exit flow.
    var quitSignalled = false;
    function signalQuit(status, reason) {
      if (quitSignalled) return;
      quitSignalled = true;
      try {
        parent.postMessage({
          type: "loveweb:quit",
          status: status == null ? 0 : status,
          reason: reason || null,
        }, "*");
      } catch (e) {}
    }

    var Module = {
      arguments: ["./game.love"],
      INITIAL_MEMORY: 33554432,
      printErr: (t) => { if (!handleMagicLine(t)) log("error", t); },
      print:    (t) => { if (!handleMagicLine(t)) log("info", t); },
      // Emscripten's runtime exit hooks. love.event.quit() in Lua breaks
      // the main loop; love.js then calls emscripten_force_exit which
      // invokes Module.quit and Module.onExit. We register for both
      // because the exact path depends on love.js version, and add
      // onAbort for hard-crash paths so the parent can still recover.
      onExit:  function (code) { signalQuit(code, null); },
      onAbort: function (what) { signalQuit(1, String(what || "abort")); },
      canvas: (function(){
        const c = document.getElementById("canvas");
        c.addEventListener("webglcontextlost", (e) => { log("error", "webgl lost"); e.preventDefault(); }, false);
        return c;
      })(),
      setStatus: function(text) {
        const boot = document.getElementById("boot");
        if (text) {
          if (boot) boot.textContent = text;
        } else if (Module.remainingDependencies === 0) {
          if (boot) boot.style.display = "none";
          // Belt-and-suspenders: also force canvas visible, since some
          // themed CSS hides it by default until this hook fires.
          const c = document.getElementById("canvas");
          if (c) { c.style.visibility = "visible"; c.style.display = "block"; }
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function(left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? ("preparing " + (this.totalDependencies-left) + "/" + this.totalDependencies) : "");
      },
      preRun: [
        function preIdentity() {
          // Write __loveweb__/identity.json before love.load() so games
          // can branch on it from the very first frame. Re-uses the
          // achievementsPromise to discover loveIdentity (set by the
          // achievements:state message handler), since identity files
          // also have to land inside the LÖVE identity dir.
          Module.addRunDependency("loveweb-identity");
          (async () => {
            try {
              const FS = Module.FS;
              if (!FS) throw new Error("Module.FS not available");
              const id = await Promise.race([
                portalIdentityPromise,
                new Promise((res) => setTimeout(function () { res({ signedIn: false }); }, 3000)),
              ]);
              // Wait briefly for loveIdentity too — the achievements
              // message also carries it. If it never arrives we skip the
              // injection; the runtime hot-rewrites identity.json once
              // loveIdentity becomes known.
              await Promise.race([
                achievementsPromise,
                new Promise((res) => setTimeout(res, 3000)),
              ]);
              if (!loveIdentity) {
                log("warn", "identity injection: no LÖVE identity provided yet; deferring");
                return;
              }
              const dir = SAVE_ROOT + "/" + loveIdentity + "/" + LOVEWEB_META_DIR;
              try { FS.mkdirTree(dir); } catch (e) {}
              const bytes = new TextEncoder().encode(JSON.stringify(id || { signedIn: false }));
              FS.writeFile(dir + "/identity.json", bytes);
              log("info", "identity injected at " + dir + "/identity.json");
            } catch (e) {
              log("warn", "identity injection: " + e);
            } finally {
              Module.removeRunDependency("loveweb-identity");
            }
          })();
        },
        function preAchievements() {
          // Inject the current achievement state at a stable path inside
          // the LÖVE identity dir so the game can read it with
          // `love.filesystem.read("__loveweb__/achievements.json")`.
          // We wait up to 3s for the parent to push the state + identity;
          // absence is not fatal — we skip the write and the game treats
          // a missing file as "nothing unlocked yet".
          Module.addRunDependency("loveweb-achievements");
          (async () => {
            try {
              const FS = Module.FS;
              if (!FS) throw new Error("Module.FS not available");
              const unlocks = await Promise.race([
                achievementsPromise,
                new Promise((res) => setTimeout(function(){ res([]); }, 3000)),
              ]);
              if (!loveIdentity) {
                log("warn", "achievement state: no identity provided by portal; skipping injection");
                return;
              }
              // Pre-create the identity dir. love.js/physfs will reuse
              // this dir when the game calls love.filesystem.write, so
              // we're not racing LÖVE's init.
              const dir = SAVE_ROOT + "/" + loveIdentity + "/" + LOVEWEB_META_DIR;
              try { FS.mkdirTree(dir); } catch {}
              const payload = JSON.stringify({
                version: 1,
                unlocks: unlocks,
              });
              const bytes = new TextEncoder().encode(payload);
              FS.writeFile(dir + "/achievements.json", bytes);
              log("info", "achievement state injected at " + dir + " (" + unlocks.length + " unlock(s))");
            } catch (e) { log("warn", "achievement state injection: " + e); }
            finally { Module.removeRunDependency("loveweb-achievements"); }
          })();
        },
        function prePopulate() {
          Module.addRunDependency("loveweb-saves");
          (async () => {
            try {
              // IMPORTANT: use Module.FS, not bare FS. Emscripten's FS is
              // a closure-local in love.js; it's only exposed to user code
              // via the Module object. Referencing `FS` here resolves to
              // window.FS, which is undefined — previously every write
              // silently failed with a "ReferenceError: FS is not defined"
              // buried in the bridge log.
              const FS = Module.FS;
              if (!FS) throw new Error("Module.FS not available");

              const files = await Promise.race([
                manifestPromise,
                new Promise((res) => setTimeout(function(){ res([]); }, 4000)),
              ]);
              for (const f of files) {
                const b64 = await requestRemoteRead(f.path);
                if (!b64) { log("warn", "no data returned for " + f.path); continue; }
                const bytes = b64ToBytes(b64);
                const full = SAVE_ROOT + "/" + f.path.replace(/^\//, "");
                const dir = full.substring(0, full.lastIndexOf("/"));
                try { FS.mkdirTree(dir); } catch {}
                try {
                  FS.writeFile(full, bytes);
                  log("info", "wrote " + full + " (" + bytes.length + " bytes)");
                } catch (e) {
                  log("warn", "write " + full + ": " + e);
                }
              }
              log("info", "prepopulated " + files.length + " save file(s)");
            } catch (e) { log("warn", "prepopulate: " + e); }
            finally { Module.removeRunDependency("loveweb-saves"); }
          })();
        },
      ],
      postRun: [
        function installQuitHook() {
          // love.js/emscripten 11 assigns Module.quit during runtime init;
          // by postRun time it exists and we can wrap it. This catches the
          // love.event.quit() path — the Lua-side clean-exit signal —
          // which emscripten routes through Module.quit once love.run
          // returns.
          var origQuit = Module.quit;
          Module.quit = function (status, toThrow) {
            signalQuit(status, null);
            if (typeof origQuit === "function") {
              try { return origQuit.call(Module, status, toThrow); } catch (e) {}
            }
          };
        },
        function startSyncLoop() {
          parent.postMessage({ type: "loveweb:ready", game: SLUG }, "*");

          const FS = Module.FS; // same gotcha as prePopulate; use Module.FS
          if (!FS) { log("error", "postRun: Module.FS not available"); return; }

          const mtimes = new Map();
          function walk(dir, visit) {
            let entries;
            try { entries = FS.readdir(dir); } catch { return; }
            for (const e of entries) {
              if (e === "." || e === "..") continue;
              const p = dir + "/" + e;
              let st; try { st = FS.stat(p); } catch { continue; }
              if (FS.isDir(st.mode)) walk(p, visit);
              else visit(p, st);
            }
          }

          // Any path containing /__loveweb__/ is portal-managed metadata
          // and must not be synced back to /api/saves — otherwise the
          // injected achievement state would round-trip into game_saves.
          // We match on the segment rather than a specific prefix so
          // this holds regardless of identity dir placement (the meta
          // file now lives at <SAVE_ROOT>/<identity>/__loveweb__/...).
          const metaSegment = "/" + LOVEWEB_META_DIR + "/";
          setInterval(() => {
            try {
              try { FS.mkdirTree(SAVE_ROOT); } catch {}
              walk(SAVE_ROOT, (p, st) => {
                if (p.indexOf(metaSegment) >= 0) return;
                const mt = +st.mtime;
                const prev = mtimes.get(p);
                if (prev === mt) return;
                mtimes.set(p, mt);
                if (prev === undefined) return; // first-seen on pre-populate; skip echo
                try {
                  const bytes = FS.readFile(p);
                  const rel = p.replace(SAVE_ROOT + "/", "");
                  parent.postMessage({
                    type: "loveweb:save:write",
                    path: rel,
                    dataB64: bytesToB64(bytes),
                    meta: { size: bytes.byteLength, mtime: mt },
                  }, "*");
                } catch (e) { log("warn", "flush " + p + ": " + e); }
              });
            } catch {}
          }, 2000);

          window.addEventListener("beforeunload", () => {
            try {
              walk(SAVE_ROOT, (p) => {
                if (p.indexOf(metaSegment) >= 0) return;
                const bytes = FS.readFile(p);
                const rel = p.replace(SAVE_ROOT + "/", "");
                parent.postMessage({
                  type: "loveweb:save:write",
                  path: rel,
                  dataB64: bytesToB64(bytes),
                  meta: { final: true },
                }, "*");
              });
            } catch {}
          });
        },
      ],
    };
    Module.setStatus("downloading…");
    window.onerror = function(){ Module.setStatus("exception: see console"); };

    var applicationLoad = function(){ Love(Module); };
  </script>

  <!-- love.js emits game.js (assets manifest) + love.js (wasm loader). -->
  <script type="text/javascript" src="game.js"></script>
  <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>
</body>
</html>
